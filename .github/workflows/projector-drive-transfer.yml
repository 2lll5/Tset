name: projector-drive-transfer
on:
  push:
    branches: [ projector-drive-transfer ]
    paths:
      - .github/workflows/projector-drive-transfer.yml

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: projector-drive-transfer
      - name: Download Google TV package
        env:
          GOOGLETV_URL: https://release-assets.githubusercontent.com/github-production-release-asset/1366807640/107bcfb2-7409-4b06-a2db-765eb14da21b?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-09-30T04%3A14%3A16Z&rscd=attachment%3B+filename%3DProjectorApplications-GoogleTV.zip&rsct=application%2Foctet-stream&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-09-30T03%3A14%3A12Z&ske=2026-09-30T04%3A14%3A16Z&sks=b&skv=2018-11-09&sig=K4K2uR3UGUe44UTcWlUGwc7m3DaCmTJ5tAHqN02fsrE%3D&jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmVsZWFzZS1hc3NldHMuZ2l0aHVidXNlcmNvbnRlbnQuY29tIiwia2V5Ijoia2V5MSIsImV4cCI6MTc5MDczOTMxMCwibmJmIjoxNzkwNzM5MDEwLCJwYXRoIjoicmVsZWFzZWFzc2V0cHJvZHVjdGlvbi5ibG9iLmNvcmUud2luZG93cy5uZXQifQ.ZjK9o4oUmq49EM5hkws51Y_Z_7VMs793B3mK947qkZ0&response-content-disposition=attachment%3B%20filename%3DProjectorApplications-GoogleTV.zip&response-content-type=application%2Foctet-stream
        run: |
          curl -fL "$GOOGLETV_URL" -o ProjectorApplications-GoogleTV.zip
          test -s ProjectorApplications-GoogleTV.zip
      - name: Commit temporary Google TV package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ProjectorApplications-GoogleTV.zip
          if ! git diff --cached --quiet; then
            git commit -m "Temporary ProjectorApplications Google TV Drive transfer"
            git push origin projector-drive-transfer
          fi
